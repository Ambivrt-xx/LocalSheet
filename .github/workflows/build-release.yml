name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 openpyxl pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name LocalSheet ^
            --add-data "src;src" ^
            src/app.py

      - name: Verify build
        run: |
          if not exist dist\LocalSheet.exe exit 1
          dir dist\LocalSheet.exe

      - name: Create installer zip
        run: |
          copy install_windows.bat dist\
          copy uninstall_windows.bat dist\
          copy Install.bat dist\
          copy Uninstall.bat dist\
          cd dist
          7z a LocalSheet-Windows.zip LocalSheet.exe install_windows.bat uninstall_windows.bat Install.bat Uninstall.bat

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="v0.0.0-$(date +%Y%m%d)-$(echo $GITHUB_SHA | cut -c1-7)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: LocalSheet ${{ steps.version.outputs.version }}
          body: |
            ## LocalSheet ${{ steps.version.outputs.version }}

            ### Download

            - **LocalSheet-Windows.zip** - includes the executable plus install/uninstall scripts
            - **LocalSheet.exe** - standalone executable

            ### Install

            1. Download and extract the zip
            2. Run Install.bat (or install_windows.bat)
            3. Find LocalSheet on your Desktop and Start Menu

            ### Uninstall

            Run Uninstall.bat to remove all shortcuts and files.
          files: |
            dist/LocalSheet.exe
            dist/LocalSheet-Windows.zip
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
