name: Build & Release LocalSheet

on:
  push:
    tags:
      - 'v*'      # Trigger by pushing a tag like v1.0.0
  workflow_dispatch:  # Or trigger manually from GitHub Actions tab

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          python build.py --clean

      - name: Verify build
        run: |
          if (Test-Path "dist/LocalSheet.exe") {
            Write-Host "✓ Build successful"
          } else {
            Write-Host "✗ Build failed"
            exit 1
          }
        shell: pwsh

      - name: Create installer zip
        run: |
          mkdir release
          Copy-Item "dist/LocalSheet.exe" "release/"
          Copy-Item "Install.bat" "release/" -ErrorAction SilentlyContinue
          Copy-Item "Uninstall.bat" "release/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "release/*" -DestinationPath "release/LocalSheet-Windows.zip"
        shell: pwsh

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v1.0.0-$(date +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: LocalSheet ${{ steps.version.outputs.tag }}
          body: |
            ## LocalSheet ${{ steps.version.outputs.tag }}

            ### Download
            - **LocalSheet.exe** — Standalone executable, no installation needed
            - **LocalSheet-Windows.zip** — Includes exe + installer scripts

            ### Install
            1. Download `LocalSheet.exe`
            2. Double-click to run — that's it!

            Or use the installer:
            1. Download `LocalSheet-Windows.zip`
            2. Extract and double-click `Install.bat`
            3. Shortcuts appear on Desktop and Start Menu

            ### Features
            - Fully offline spreadsheet
            - 40+ formulas, charts, conditional formatting
            - No account, no cloud, no tracking
          files: |
            dist/LocalSheet.exe
            release/LocalSheet-Windows.zip
          draft: false
          prerelease: false
